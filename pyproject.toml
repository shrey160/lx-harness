[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lx-harness"
version = "0.1.0"
description = "Local harness workflow on the pinned portable core"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "h2portable==0.1.0",
    "keyring==25.6.0",
    "pillow==11.3.0",
]

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[project.scripts]
lx = "lx.cli:main"

[tool.uv.sources]
h2portable = { path = "../harness2_portable_core", editable = true }
harness2-cli = { path = "../harness2_portable_core/vendor/harness2-cli", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

